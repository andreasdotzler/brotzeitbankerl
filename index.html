  <script>
    var listbenches = '<div id="rightinfo"> ';
    var firstcall = true;
    var attr_impress = '<a href="http://andreasdotzler.github.io/impressum.html">Impressum</a>',
    attr_osm = 'Map data &copy; <a href="http://openstreetmap.org/">OpenStreetMap</a> contributors',
    attr_overpass = 'POI via <a href="http://www.overpass-api.de/">Overpass API</a>';
    var osm = new L.TileLayer('http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {opacity: 0.7, attribution: [attr_osm, attr_overpass, attr_impress].join(' | ')});
  	//var map = new L.Map('map').addLayer(osm).setView(new L.LatLng(52.265, 10.524), 10);
  	var map = new L.Map('map');
    
    function onLocationFound(e) {
      var radius = e.accuracy / 2;
      L.marker(e.latlng).addTo(map)
        .bindPopup("You are within " + radius + " meters from this point").openPopup();
      L.circle(e.latlng, radius).addTo(map);
    }

    function onLocationError(e) {
        map.setView(new L.LatLng(48.1333, 11.5667), 15);
    }

    map.on('popupopen', function(e) {
      var marker = e.popup._source;
      window.RW.render();
    });

    map.on('locationfound', onLocationFound);
    map.on('locationerror', onLocationError);
  	map.addLayer(osm);

    var bankerlid = location.search.split('bankerl=')[1] ? location.search.split('bankerl=')[1] : 0;
    if (bankerlid != 0)
    {
        url = "http://overpass-api.de/api/interpreter?data=[out:json];node(" + bankerlid + ");out;";
        $.getJSON(url, null, function (data) {
            if (data.elements.length == 0){
                alert("Des Bankerl Nummer " + bankerlid + "gibts nicht!");
                return;
            }
            
            e = data.elements[0];
//            map.locate({setView: false, maxZoom: 16});
            map.setView(new L.LatLng(e.lat, e.lon), 15);
            });
    }
    else{
        map.locate({setView: true, maxZoom: 16});
    }
    
    
    //OverPassAPI overlay
    var opl = new L.OverPassLayer({
      query: "http://overpass-api.de/api/interpreter?data=[out:json];node(BBOX)[amenity=bench];out;",
      callback: function(data) {
        if (firstcall) {
            var bestbankerl = data.elements.slice(0,9);
            $.each(bestbankerl , function( key, value ) {
                //alert( key + ": " + value.id );
                //$("#inforight").append(
                //"<li><a href = \"index.html?bankerl="  + value.id + "\">" + value.id + "</a></li>");
            });
            firstcall = false;
        }
        for(i=0;i<data.elements.length;i++) {
          e = data.elements[i];

          if (e.id in this.instance._ids) return;
          this.instance._ids[e.id] = true;
          var pos = new L.LatLng(e.lat, e.lon);
          var popup = this.instance._poiInfo(e.tags,e.id);
          var color = e.tags.collection_times ? 'green':'red';
          var circle = L.circle(pos, 50, {
            color: color,
            fillColor: '#0a0',
            fillOpacity: 0.5
          })
          .bindPopup(popup);
          this.instance.addLayer(circle);
          this.instance._osmidtoleafletid[e.id] = this.instance.getLayerId(circle);
        }
      },
    });
    map.addLayer(opl);
    

  </script>
