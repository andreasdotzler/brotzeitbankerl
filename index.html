<!DOCTYPE html>
<html lang="de">
<head>
  <title>Brotzeitbankerl</title>
  <meta charset="utf-8" />
  <meta name="description" content="Karte von Bänken und Picknicktischen, mit Link zum Bearbeiten bei OpenStreetMap und zur Fußroute." />
  <meta name="keywords" content="Brotzeitbankerl, Brotzeit, Bankerl, Picknicktisch" />
  <meta name="author" content="Andreas Dotzler">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="OverPassLayer.js"></script>
  <style>
    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
    }
    .leaflet-bottom { margin-bottom: env(safe-area-inset-bottom); }
    .leaflet-top { margin-top: env(safe-area-inset-top); }
    .leaflet-left { margin-left: env(safe-area-inset-left); }
    .leaflet-right { margin-right: env(safe-area-inset-right); }
    .bb-legend, .bb-zoom-hint {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 15px;
      line-height: 1.4;
      max-width: calc(100vw - 24px);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }
    .bb-legend .swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin: 0 6px 0 12px;
      vertical-align: -1px;
      box-sizing: border-box;
    }
    .bb-legend .swatch:first-child { margin-left: 0; }
    .bb-legend .swatch.bench { background: #4c8ed9; border: 2px solid #1d4e89; }
    .bb-legend .swatch.table { background: #f0a202; border: 2px solid #8a5a00; }
    .leaflet-popup-content {
      width: auto !important;
      max-width: calc(100vw - 2rem);
      margin: 12px 14px;
      font-size: 16px;
      line-height: 1.35;
    }
    .bb-popup {
      width: min(260px, calc(100vw - 72px));
    }
    .bb-type { font-weight: 700; margin: 0 0 8px; }
    .bb-route-label { margin: 10px 0 4px; font-size: 14px; }
    .bb-actions, .bb-route {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .bb-actions a, .bb-route a {
      flex: 1 1 140px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
      box-sizing: border-box;
      background: #f4f1ea;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      color: #1a1a1a;
      touch-action: manipulation;
    }
    .bb-tags-wrap { max-height: 30vh; overflow: auto; margin-top: 10px; }
    .bb-tags { width: 100%; border-collapse: collapse; font-size: 14px; }
    .bb-tags th, .bb-tags td {
      text-align: left;
      vertical-align: top;
      padding: 2px 8px 2px 0;
    }
    @media (max-width: 600px) {
      .bb-actions a, .bb-route a { flex-basis: 100%; }
    }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  var attrImpress = '<a href="https://andreasdotzler.github.io/impressum.html">Impressum</a>';
  var attrOsm = 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
  var attrOverpass = 'POI via <a href="https://www.overpass-api.de/">Overpass API</a>';
  var map = L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    opacity: 0.7,
    attribution: [attrOsm, attrOverpass, attrImpress].join(" | ")
  }).addTo(map);

  var Legend = L.Control.extend({
    options: { position: "bottomleft" },
    onAdd: function () {
      var div = L.DomUtil.create("div", "bb-legend");
      div.innerHTML = '<span class="swatch bench"></span>Bankerl<span class="swatch table"></span>Picknicktisch';
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    }
  });

  var opl = new L.OverPassLayer({
    query: "[out:json][timeout:25];(node(BBOX)[amenity=bench];node(BBOX)[leisure=picnic_table];);out;"
  });
  var layerAdded = false;

  function ensureLayer() {
    if (!layerAdded) {
      map.addLayer(opl);
      map.addControl(new Legend());
      layerAdded = true;
    }
  }

  function onLocationFound(e) {
    L.marker(e.latlng).addTo(map).bindPopup("Du bist ungefähr hier.");
    L.circle(e.latlng, {
      radius: e.accuracy / 2,
      color: "#1d4e89",
      weight: 1,
      fillOpacity: 0.08
    }).addTo(map);
  }

  function showArea(lat, lon, zoom) {
    map.setView([lat, lon], zoom);
    ensureLayer();
  }

  map.on("locationfound", onLocationFound);
  map.on("locationerror", function () {
    showArea(48.1333, 11.5667, 15);
  });
  map.on("popupopen", function (e) {
    requestAnimationFrame(function () {
      var el = e.popup.getElement();
      if (!el) return;
      var rect = el.getBoundingClientRect();
      var pad = 8;
      var dx = 0;
      var dy = 0;
      if (rect.height > window.innerHeight - pad * 2) {
        dy = rect.top - pad;
      } else if (rect.top < pad) {
        dy = rect.top - pad;
      } else if (rect.bottom > window.innerHeight - pad) {
        dy = rect.bottom - (window.innerHeight - pad);
      }
      if (rect.left < pad) dx = rect.left - pad;
      else if (rect.right > window.innerWidth - pad) dx = rect.right - (window.innerWidth - pad);
      if (dx || dy) map.panBy([dx, dy]);
    });
  });

  showArea(48.1333, 11.5667, 11);

  var bankerlMatch = location.search.match(/[?&]bankerl=(\d+)\b/);
  if (bankerlMatch) {
    var bankerlid = bankerlMatch[1];
    var bankerlUrl = "https://overpass-api.de/api/interpreter?data=" +
      encodeURIComponent("[out:json];node(" + bankerlid + ");out;");
    fetchOverpass(bankerlUrl, 10000, 20000).then(function (data) {
      var element = data.elements && data.elements[0];
      if (!element || element.lat == null || element.lon == null) {
        alert("Des Bankerl Nummer " + bankerlid + " gibts nicht!");
        showArea(48.1333, 11.5667, 15);
        return;
      }
      showArea(element.lat, element.lon, 16);
    }).catch(function () {
      alert("Die Bankerl-Daten konnten nicht geladen werden.");
      showArea(48.1333, 11.5667, 15);
    });
  } else {
    map.locate({ setView: true, maxZoom: 16 });
  }
</script>
</body>
</html>
