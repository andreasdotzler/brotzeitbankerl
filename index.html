<!DOCTYPE html>
<html lang="de">
<head>
  <title>Brotzeitbankerl</title>
  <meta charset="utf-8" />
  <meta name="description" content="Karte von Bänken und Picknicktischen, mit Link zum Bearbeiten bei OpenStreetMap und zur Fußroute." />
  <meta name="keywords" content="Brotzeitbankerl, Brotzeit, Bankerl, Picknicktisch" />
  <meta name="author" content="Andreas Dotzler">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="OverPassLayer.js"></script>
  <style>
    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
    }
    .leaflet-bottom { margin-bottom: env(safe-area-inset-bottom); }
    .leaflet-top { margin-top: env(safe-area-inset-top); }
    .leaflet-left { margin-left: env(safe-area-inset-left); }
    .leaflet-right { margin-right: env(safe-area-inset-right); }
    .bb-legend, .bb-zoom-hint {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 15px;
      line-height: 1.4;
      max-width: calc(100vw - 24px);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }
    .bb-legend .swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin: 0 6px 0 12px;
      vertical-align: -1px;
      box-sizing: border-box;
    }
    .bb-legend .swatch:first-child { margin-left: 0; }
    .bb-legend .swatch.bench { background: #4c8ed9; border: 2px solid #1d4e89; }
    .bb-legend .swatch.table { background: #f0a202; border: 2px solid #8a5a00; }
    .leaflet-popup-content {
      width: auto !important;
      max-width: calc(100vw - 2rem);
      max-height: calc(100dvh - 36px - env(safe-area-inset-top));
      overflow-y: auto;
      margin: 12px 14px;
      font-size: 16px;
      line-height: 1.35;
    }
    .bb-popup {
      width: min(300px, calc(100vw - 72px));
    }
    .bb-head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0 0 10px;
      padding-right: 12px;
    }
    .bb-titles { flex: 1; min-width: 0; }
    .bb-kind {
      margin: 0 0 2px;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 600;
      color: #6b645b;
    }
    .bb-title {
      margin: 0;
      font-weight: 700;
      font-size: 17px;
      line-height: 1.3;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }
    .bb-actions {
      display: flex;
      flex: none;
      gap: 6px;
    }
    .bb-icon {
      position: relative;
      width: 36px;
      height: 36px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      border: 0;
      border-radius: 8px;
      background: #f4f1ea;
      color: #1a1a1a;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
    }
    .bb-icon svg { display: block; }
    .bb-icon:hover,
    .bb-icon:focus-visible {
      background: #e7e1d4;
      outline: none;
    }
    .bb-share.bb-copied::after {
      content: attr(data-copied);
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 1;
      padding: 4px 6px;
      border-radius: 4px;
      background: #1a1a1a;
      color: #fff;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }
    .bb-photos { display: flex; flex-direction: column; gap: 8px; margin: 0 0 10px; }
    .bb-photos a { position: relative; display: block; line-height: 0; }
    .bb-photos img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }
    .bb-photo-label {
      position: absolute;
      left: 8px;
      bottom: 8px;
      max-width: calc(100% - 16px);
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(26, 26, 26, 0.78);
      color: #fff;
      font-size: 12px;
      line-height: 1.2;
      pointer-events: none;
    }
    .bb-route-label {
      margin: 10px 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: #6b645b;
    }
    .bb-route {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .bb-route a {
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 8px;
      box-sizing: border-box;
      background: #f4f1ea;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      color: #1a1a1a;
      font-size: 13px;
      line-height: 1.2;
      touch-action: manipulation;
    }
    .bb-details { margin-top: 10px; font-size: 14px; }
    .bb-details summary {
      cursor: pointer;
      font-weight: 600;
      color: #3a342c;
      padding: 8px 0 2px;
    }
    .bb-tags-wrap { max-height: 30vh; overflow: auto; margin-top: 6px; }
    .bb-tags { width: 100%; border-collapse: collapse; font-size: 14px; }
    .bb-tags th, .bb-tags td {
      text-align: left;
      vertical-align: top;
      padding: 2px 8px 2px 0;
      overflow-wrap: break-word;
    }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  var attrImpress = '<a href="https://andreasdotzler.github.io/impressum.html">' + escapeHtml(t("impressum")) + "</a>";
  var attrOsm = 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
  var attrOverpass = 'POI via <a href="https://www.overpass-api.de/">Overpass API</a>';
  var map = L.map("map", { zoomControl: false });
  L.control.zoom({
    zoomInTitle: t("zoomIn"),
    zoomOutTitle: t("zoomOut")
  }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    opacity: 0.7,
    attribution: [attrOsm, attrOverpass, attrImpress].join(" | ")
  }).addTo(map);

  var Legend = L.Control.extend({
    options: { position: "bottomleft" },
    onAdd: function () {
      var div = L.DomUtil.create("div", "bb-legend");
      div.innerHTML = '<span class="swatch bench"></span>' + escapeHtml(t("bench")) + '<span class="swatch table"></span>' + escapeHtml(t("picnicTable"));
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    }
  });

  var opl = new L.OverPassLayer({
    query: "[out:json][timeout:25];(node(BBOX)[amenity=bench];node(BBOX)[leisure=picnic_table];);out;"
  });
  var layerAdded = false;

  function ensureLayer() {
    if (!layerAdded) {
      map.addLayer(opl);
      map.addControl(new Legend());
      layerAdded = true;
    }
  }

  function onLocationFound(e) {
    L.marker(e.latlng).addTo(map).bindPopup(t("youAreHere"));
    L.circle(e.latlng, {
      radius: e.accuracy / 2,
      color: "#1d4e89",
      weight: 1,
      fillOpacity: 0.08
    }).addTo(map);
  }

  function showArea(lat, lon, zoom) {
    map.setView([lat, lon], zoom);
    ensureLayer();
  }

  map.on("locationfound", onLocationFound);
  map.on("locationerror", function () {
    showArea(48.1333, 11.5667, 15);
  });
  function nudgePopup(popup) {
    var el = popup.getElement();
    if (!el) return;
    var rect = el.getBoundingClientRect();
    var pad = 8;
    var dx = 0;
    var dy = 0;
    if (el.querySelector(".bb-popup")) {
      dy = rect.top - pad;
    } else if (rect.top < pad) {
      dy = rect.top - pad;
    } else if (rect.bottom > window.innerHeight - pad) {
      dy = rect.bottom - (window.innerHeight - pad);
    }
    if (rect.left < pad) dx = rect.left - pad;
    else if (rect.right > window.innerWidth - pad) dx = rect.right - (window.innerWidth - pad);
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) map.panBy([dx, dy], { animate: false });
  }

  function showCopied(button) {
    button.classList.add("bb-copied");
    button.setAttribute("aria-label", t("copied"));
    clearTimeout(button._bbCopiedTimer);
    button._bbCopiedTimer = setTimeout(function () {
      button.classList.remove("bb-copied");
      button.setAttribute("aria-label", t("share"));
    }, 1600);
  }

  function copyShareUrl(url, button) {
    function legacyCopy() {
      try {
        var input = document.createElement("textarea");
        input.value = url;
        input.setAttribute("readonly", "");
        input.style.position = "fixed";
        input.style.left = "-9999px";
        document.body.appendChild(input);
        input.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(input);
        if (ok) showCopied(button);
      } catch (err) {}
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        showCopied(button);
      }).catch(legacyCopy);
      return;
    }
    legacyCopy();
  }

  map.on("popupopen", function (e) {
    var el = e.popup.getElement();
    if (el) {
      var shareBtn = el.querySelector(".bb-share");
      if (shareBtn && !shareBtn._bbWired) {
        shareBtn._bbWired = true;
        shareBtn.addEventListener("click", function (ev) {
          ev.preventDefault();
          var url = shareBtn.getAttribute("data-url");
          var title = shareBtn.getAttribute("data-title") || "Brotzeitbankerl";
          if (navigator.share) {
            navigator.share({ title: title, text: title, url: url }).catch(function (err) {
              if (err && err.name === "AbortError") return;
              copyShareUrl(url, shareBtn);
            });
            return;
          }
          copyShareUrl(url, shareBtn);
        });
      }
      var details = el.querySelector(".bb-details");
      if (details && !details._bbWired) {
        details._bbWired = true;
        details.addEventListener("toggle", function () {
          requestAnimationFrame(function () { nudgePopup(e.popup); });
        });
      }
      var images = el.querySelectorAll("img");
      for (var i = 0; i < images.length; i++) {
        if (images[i].complete) continue;
        images[i].addEventListener("load", function () {
          requestAnimationFrame(function () { nudgePopup(e.popup); });
        });
      }
    }
    requestAnimationFrame(function () { nudgePopup(e.popup); });
  });

  showArea(48.1333, 11.5667, 11);

  var bankerlMatch = location.search.match(/[?&]bankerl=(\d+)\b/);
  if (bankerlMatch) {
    var bankerlid = bankerlMatch[1];
    var bankerlUrl = "https://overpass-api.de/api/interpreter?data=" +
      encodeURIComponent("[out:json];node(" + bankerlid + ");out;");
    fetchOverpass(bankerlUrl, 10000, 20000).then(function (data) {
      var element = data.elements && data.elements[0];
      if (!element || element.lat == null || element.lon == null) {
        alert(t("missingBench", { id: bankerlid }));
        showArea(48.1333, 11.5667, 15);
        return;
      }
      opl.setFocus(bankerlid);
      showArea(element.lat, element.lon, 16);
    }).catch(function () {
      alert(t("loadFailed"));
      showArea(48.1333, 11.5667, 15);
    });
  } else {
    map.locate({ setView: true, maxZoom: 16 });
  }
</script>
</body>
</html>
